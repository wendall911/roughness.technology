name: CI

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.33.0
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Prepare
              id: prepare
              run: |
                  VERSION=${GITHUB_SHA::8}
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    VERSION=${GITHUB_REF/refs\/tags\//}
                  fi
                  echo BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') >> $GITHUB_OUTPUT
                  echo VERSION=${VERSION} >> $GITHUB_OUTPUT
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build website
              run: pnpm run build

            - name: Generate CNAME
              run: echo "roughness.technology" > build/CNAME

            - name: Deploy to wendall911.github.io
              uses: cpina/github-action-push-to-another-repository@v1.7.2
              env:
                  SSH_DEPLOY_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
              with:
                  source-directory: build/
                  destination-github-username: wendall911
                  destination-repository-name: wendall911.github.io
                  user-email: wendall@83864.com
                  create-target-branch-if-needed: true
                  commit-message: '${{ steps.prepare.outputs.VERSION }}'
